name: anime_plus
description: AnimePlus

publish_to: "none"

version: 1.9.1+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0d1321"
  image: assets/images/splash.png

  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
